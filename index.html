<script>
/* Screens: home → create/detail → oral|written study → result. Data is local only in localStorage. */
const KEY='lernfunken-pwa-v1';
const subjects={Englisch:['Deutsch','Englisch','EN'],Französisch:['Deutsch','Französisch','FR'],Spanisch:['Deutsch','Spanisch','ES'],Mathematik:['Aufgabe','Lösung','×'],Geschichte:['Ereignis','Datum / Antwort','⌛'],Biologie:['Begriff','Erklärung','⌬'],'Freie Karten':['Frage','Antwort','?']};
const AVATARS=[
  {id:'spark',icon:'✦',name:'Funke',price:0},{id:'comet',icon:'☄️',name:'Komet',price:60},
  {id:'moon',icon:'🌙',name:'Mond',price:65},{id:'fox',icon:'🦊',name:'Fuchs',price:70},
  {id:'owl',icon:'🦉',name:'Eule',price:70},{id:'cat',icon:'🐱',name:'Katze',price:85},
  {id:'unicorn',icon:'🦄',name:'Einhorn',price:140},{id:'robot',icon:'🤖',name:'Roboter',price:120},
  {id:'planet',icon:'🪐',name:'Saturn',price:125},{id:'butterfly',icon:'🦋',name:'Schmetterling',price:110},
  {id:'crystal',icon:'🔮',name:'Kristall',price:150},{id:'phoenix',icon:'🔥',name:'Phoenix',price:170}
];
const AURAS=[
  {id:'none',name:'Klar',icon:'○',price:0,fx:'none'},{id:'stardust',name:'Sternenstaub',icon:'✦',price:65,fx:'stardust'},{id:'nebula',name:'Nebel',icon:'☁',price:80,fx:'nebula'},{id:'sunset',name:'Sonnenuntergang',icon:'◐',price:95,fx:'sunset'},{id:'crystal',name:'Kristallglanz',icon:'◇',price:115,fx:'crystal'},{id:'aurora',name:'Polarlicht',icon:'≋',price:140,fx:'aurora'}
];
const COLORS=[
  {id:'blue',hex:'#3154c7',name:'Ultramarin',price:0},{id:'violet',hex:'#7c5ce0',name:'Amethyst',price:35},
  {id:'pink',hex:'#e05c95',name:'Wildrose',price:40},{id:'mint',hex:'#20a99b',name:'Jade',price:45},
  {id:'sun',hex:'#e6a62d',name:'Solar',price:45},{id:'night',hex:'#1d2e67',name:'Onyx',price:55},
  {id:'lilac',hex:'#aa82dd',name:'Lavendel',price:60},{id:'coral',hex:'#e46d61',name:'Koralle',price:60},
  {id:'ocean',hex:'#167ca5',name:'Ozean',price:75},{id:'aurora',hex:'#3b9d89',name:'Aurora',price:85}
];
let state={screen:'home',lessons:[],coins:0,selected:null,mode:null,direction:'forward',study:[],index:0,correct:0,unsure:[],round:1,revealed:false,writtenChecked:false,editId:null,avatar:{id:'spark',color:'blue',aura:'none',owned:['a:spark','c:blue','u:none']}};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY))||{});state.avatar={id:'spark',color:'blue',owned:['a:spark','c:blue'],...(state.avatar||{})}}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify({lessons:state.lessons,coins:state.coins,avatar:state.avatar}));}
function avatar(){return AVATARS.find(x=>x.id===state.avatar.id)||AVATARS[0]}
function avatarColor(){return (COLORS.find(x=>x.id===state.avatar.color)||COLORS[0]).hex}
function aura(){return AURAS.find(x=>x.id===state.avatar.aura)||AURAS[0]}
function avatarStyle(){let a=aura(),c=avatarColor();let fx={none:'',stardust:'box-shadow:0 0 0 12px rgba(255,255,255,.28),0 0 35px 10px #ffd66a;',nebula:'box-shadow:0 0 0 14px rgba(133,92,224,.22),0 0 42px 16px #aa8aff;',sunset:'box-shadow:0 0 0 13px rgba(255,156,100,.22),0 0 40px 14px #ff9a6c;',crystal:'box-shadow:0 0 0 11px rgba(210,240,255,.5),0 0 37px 12px #83caff;',aurora:'box-shadow:0 0 0 14px rgba(79,232,190,.22),0 0 42px 15px #64dfff;'};return `background:${c};${fx[a.fx]||''}`}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function id(){return 'c-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function fmt(d){if(!d)return 'Kein Datum gesetzt';const x=d.split('-');return x.length===3?`${x[2]}.${x[1]}.${x[0]}`:d}
function examCountdown(d){
  if(!d)return '';
  let m=String(d).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/), exam;
  if(m) exam=new Date(+m[1],+m[2]-1,+m[3]);
  else {m=String(d).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)exam=new Date(+m[3],+m[2]-1,+m[1]);}
  if(!exam||isNaN(exam))return '';
  exam.setHours(0,0,0,0);let today=new Date();today.setHours(0,0,0,0);
  let days=Math.round((exam-today)/86400000);
  if(days===0)return '<em class="exam today">Prüfung heute</em>';
  if(days===1)return '<em class="exam soon">noch 1 Tag</em>';
  if(days>1)return `<em class="exam">noch ${days} Tage</em>`;
  return `<em class="exam past">vor ${Math.abs(days)} Tagen</em>`;
}
function learningTip(d){
  if(!d)return 'Wähle einen Lernmodus für diese Lektion.';
  let m=String(d).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/),x=m?new Date(+m[1],+m[2]-1,+m[3]):null;
  if(!x){m=String(d).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)x=new Date(+m[3],+m[2]-1,+m[1]);}
  if(!x)return 'Wähle einen Lernmodus für diese Lektion.';
  x.setHours(0,0,0,0);let t=new Date();t.setHours(0,0,0,0);let n=Math.round((x-t)/86400000);
  if(n===0)return 'Heute ist es soweit – magischer Funke für dich. Du kannst das! ✦';
  if(n===1)return 'Morgen ist es soweit. Ich drücke dir fest die Daumen! ✦';
  if(n>1&&n<=6)return 'Jetzt sind Fehlerkarten besonders wertvoll. Kleine Schritte, grosse Wirkung.';
  if(n>6&&n<=14)return 'Noch genug Zeit für regelmässige kleine Lernrunden.';
  return 'Noch entspannt Zeit – lerne in deinem eigenen Rhythmus.';
}
function homeMagic(){
  let upcoming=state.lessons.map(l=>({l,days:daysTo(l.examDate)})).filter(x=>x.days!==null&&x.days>=0).sort((a,b)=>a.days-b.days)[0];
  if(!upcoming)return `<div class="magic-nudge"><div class="wichtel-emoji" aria-label="Magischer Lernwichtel" role="img">🧙‍♀️</div><div><b>Ein kleiner Funke für dich</b><span>Jede Lernrunde macht dich ein Stück sicherer. Du schaffst das! ✦</span></div><i>✦</i></div>`;
  let {l,days}=upcoming,msg=days===0?'Heute schickt dir dein Wichtel extra viel Mut. Du schaffst das!':days===1?'Morgen ist es soweit – dein Wichtel drückt dir fest die Daumen!':`Noch ${days} Tage für ${esc(l.title)}. Ein kleiner Funke heute hilft morgen.`;
  return `<div class="magic-nudge"><div class="wichtel-emoji" aria-label="Magischer Lernwichtel" role="img">🧙‍♀️</div><div><b>${days<=1?'Du schaffst das!':'Dein kleiner Lernzauber'}</b><span>${msg}</span></div><i>✦</i></div>`;
}
function daysTo(d){if(!d)return null;let m=String(d).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/),x=m?new Date(+m[1],+m[2]-1,+m[3]):null;if(!x){m=String(d).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)x=new Date(+m[3],+m[2]-1,+m[1]);}if(!x||isNaN(x))return null;x.setHours(0,0,0,0);let t=new Date();t.setHours(0,0,0,0);return Math.round((x-t)/86400000)}
function normal(s){return String(s).toLocaleLowerCase('de-CH').trim().replace(/[.,;:!?]/g,'').replace(/\s+/g,' ')}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2400)}
function app(html){document.querySelector('#app').innerHTML=html;window.scrollTo(0,0)}
function home(){state.screen='home';state.selected=null;let cards=state.lessons.reduce((n,l)=>n+l.cards.length,0),a=avatar(),color=avatarColor(),aStyle=avatarStyle();app(`<header class="hero" style="--avatar:${color}"><div class="hero-avatar" style="${aStyle}" aria-hidden="true"><span>${a.icon}</span><i>✦</i><b>✦</b></div><div class="top"><div><p class="brand">LERNFUNKEN</p><h1 class="hello">Bereit für eine neue<br>Lernrunde?</h1><button class="avatar-link" onclick="shop()">${a.icon} Mein Lernfunke <span>›</span></button></div><button class="coins" onclick="shop()"><span class="spark">✦</span>${state.coins}</button></div></header><div class="summary"><div>${state.lessons.length?`${state.lessons.length} Lektionen · ${cards} Karten`:'Deine Sammlung beginnt hier'}<small>Alles bleibt auf diesem Gerät gespeichert</small></div><button class="summary-action" onclick="settings()">⚙</button></div>${homeMagic()}<section class="content">${state.lessons.length?`<input id="search" class="search" placeholder="Wort, Datum oder Frage suchen …" autocomplete="off"><div id="list">${lessonList(state.lessons)}</div>`:`<div class="empty"><div class="big">✦</div><h2>Noch keine Lektion.</h2><p>Erstellt Wörter, Daten, Aufgaben oder eigene Fragen und übt sie später jederzeit weiter.</p></div>`}</section><button class="fab" onclick="create()">+</button>`);let input=document.querySelector('#search');if(input)input.addEventListener('input',e=>filterLessons(e.target.value))}
function lessonList(ls){return `<p class="label">EURE LEKTIONEN</p>${ls.map(l=>`<button class="lesson" onclick="detail('${l.id}')"><div class="lesson-icon">${esc(l.icon)}</div><div class="lesson-copy"><div class="subject">${esc(l.subject)}</div><h3>${esc(l.title)}</h3><div class="meta">${l.cards.length} Karten · ${fmt(l.examDate)} ${examCountdown(l.examDate)}</div></div><span class="arrow">›</span></button>`).join('')}`}
function filterLessons(q){q=normal(q);const target=document.querySelector('#list');if(!target)return;if(!q){target.innerHTML=lessonList(state.lessons);return}const matches=[];state.lessons.forEach(l=>l.cards.forEach(c=>{if(normal(`${l.title} ${l.subject} ${c.front} ${c.back}`).includes(q))matches.push({l,c})}));target.innerHTML=matches.length?`<p class="search-note">${matches.length} Treffer für „${esc(q)}“</p><div class="search-cards">${matches.map(({l,c})=>`<button class="search-hit" onclick="detail('${l.id}')"><span class="search-subject">${esc(l.subject)} · ${esc(l.title)}</span><b>${esc(c.front)} <i>→</i> ${esc(c.back)}</b><span>Zur Lektion ›</span></button>`).join('')}</div>`:`<p class="search-note">Kein passender Eintrag</p><div class="no-results">Versuche es mit einem anderen Wort, Datum oder Fach.</div>`}
function shop(){let a=avatar(),color=avatarColor(),aStyle=avatarStyle();app(`<section class="screen shop"><button class="back" onclick="home()">‹ Übersicht</button><p class="eyebrow">DEINE KOLLEKTION</p><div class="shop-hero" style="--avatar:${color}"><div class="shop-avatar" style="${aStyle}">${a.icon}</div><div><b>${state.coins} ✦</b><span>verfügbare Coins</span></div></div><h1 class="title">Lernfunken-Studio</h1><p class="intro">Baue deine Figur Schritt für Schritt aus: Figur, Farbwelt und Aura bleiben dauerhaft in deiner Kollektion.</p><p class="label">FIGUR</p><div class="shop-grid">${AVATARS.map(x=>shopItem(x,'a',x.icon,x.id===state.avatar.id)).join('')}</div><p class="label">FARBE</p><div class="shop-grid colors">${COLORS.map(x=>shopItem(x,'c',`<i style="background:${x.hex}"></i>`,x.id===state.avatar.color)).join('')}</div><p class="label">AURA</p><div class="shop-grid">${AURAS.map(x=>shopItem(x,'u',x.icon,x.id===state.avatar.aura)).join('')}</div><button class="btn ghost" onclick="settings()">Daten & Sicherung</button></section>`)}
function shopItem(x,type,visual,selected){let key=`${type}:${x.id}`,owned=state.avatar.owned.includes(key);return `<button class="shop-item ${selected?'selected':''}" onclick="buy('${type}','${x.id}')"><span class="shop-icon">${visual}</span><b>${x.name}</b><small>${selected?'Ausgewählt':owned?'Wählen':x.price+' ✦'}</small></button>`}
function buy(type,id){let list=type==='a'?AVATARS:type==='c'?COLORS:AURAS,x=list.find(i=>i.id===id),key=`${type}:${id}`,owned=state.avatar.owned.includes(key);if(!owned){if(state.coins<x.price)return toast(`Noch ${x.price-state.coins} Coins nötig.`);state.coins-=x.price;state.avatar.owned.push(key)}if(type==='a')state.avatar.id=id;else if(type==='c')state.avatar.color=id;else state.avatar.aura=id;save();shop();toast(owned?'Ausgewählt!':`${x.name} freigeschaltet!`)}
function create(lesson=null){state.screen='create';state.editId=lesson?.id||null;let s=lesson?.subject||'Englisch', c=lesson?.cards||[card(),card()];app(`<section class="screen"><button class="back" onclick="home()">‹ Übersicht</button><p class="eyebrow">${lesson?'LEKTION BEARBEITEN':'NEUE LEKTION'}</p><h1 class="title">${lesson?'Karten ergänzen und anpassen':'Was möchtet ihr heute lernen?'}</h1><p class="intro">${lesson?'Änderungen werden direkt in dieser Lektion gespeichert.':'Erstellt eine Lektion, die ihr später jederzeit wieder öffnen könnt.'}</p><label class="field">Fach</label><div class="chips">${Object.keys(subjects).map(x=>`<button class="chip ${x===s?'active':''}" onclick="createSubject('${x}')">${subjects[x][2]} ${x}</button>`).join('')}</div><input id="subject" type="hidden" value="${esc(s)}"><label class="field">Name der Lektion</label><input id="title" class="input" value="${esc(lesson?.title||'')}" placeholder="z. B. Unit 4 – Vocabulary"><label class="field">Prüfungsdatum <span class="meta">(optional)</span></label><input id="date" class="input" value="${esc(lesson?.examDate||'')}" placeholder="z. B. 24.09.2026"><div class="field">Karteikarten</div><p class="meta">Nur vollständig ausgefüllte Karten werden gespeichert.</p><div id="cards">${cardRows(c,s)}</div><button class="btn ghost" onclick="addCard()">+ Karte hinzufügen</button><button class="btn" onclick="saveLesson()">${lesson?'Änderungen speichern':'Lektion speichern'}</button></section>`)}
function card(){return{id:id(),front:'',back:''}}function cardRows(cs,s){let [a,b]=subjects[s];return cs.map((c,i)=>`<div class="card-row" data-id="${c.id}"><input data-f="front" value="${esc(c.front)}" placeholder="${a}"><input data-f="back" value="${esc(c.back)}" placeholder="${b}"><button class="remove" onclick="this.parentElement.remove()">×</button></div>`).join('')}
function createSubject(s){const old=[...document.querySelectorAll('.card-row')].map(r=>({id:r.dataset.id,front:r.children[0].value,back:r.children[1].value}));create({...state.lessons.find(x=>x.id===state.editId),subject:s,cards:old})}
function addCard(){let s=document.querySelector('#subject').value;document.querySelector('#cards').insertAdjacentHTML('beforeend',cardRows([card()],s))}
function saveLesson(){let subject=document.querySelector('#subject').value,title=document.querySelector('#title').value.trim(),examDate=document.querySelector('#date').value.trim();let cards=[...document.querySelectorAll('.card-row')].map(r=>({id:r.dataset.id,front:r.children[0].value.trim(),back:r.children[1].value.trim()})).filter(c=>c.front&&c.back);if(!title)return toast('Bitte gib der Lektion einen Namen.');if(cards.length<2)return toast('Bitte erfasse mindestens zwei Karten.');let old=state.lessons.find(l=>l.id===state.editId), [left,right,icon]=subjects[subject];let lesson={id:old?.id||id(),subject,left,right,icon,title,examDate,cards,progress:old?.progress||freshProgress()};state.lessons=old?state.lessons.map(l=>l.id===lesson.id?lesson:l):[lesson,...state.lessons];save();detail(lesson.id)}
function freshProgress(){return{unsure:[],review:[],lastDirection:'forward',correct:0,attempted:0,rounds:0,lastScore:null}}
function detail(id){let l=state.lessons.find(x=>x.id===id);if(!l)return home();state.selected=l;state.screen='detail';let p=l.progress||freshProgress(),u=p.unsure||[],r=p.review||[];app(`<section class="screen"><button class="back" onclick="home()">‹ Übersicht</button><p class="eyebrow">LEKTION</p><div class="lesson-hero"><div class="lesson-icon">${l.icon}</div><div><div class="subject">${esc(l.subject)}</div><h1>${esc(l.title)}</h1><div class="meta">${l.cards.length} Karten · ${fmt(l.examDate)} ${examCountdown(l.examDate)}</div></div></div><div class="notice"><b>✦</b><div><b>${p.rounds?'Lernstand gespeichert':'Bereit zum Lernen?'}</b><br><small>${p.lastScore!==null?`Letzte Runde: ${p.lastScore}% · ${p.rounds} Runde${p.rounds===1?'':'n'}<br>${learningTip(l.examDate)}`:learningTip(l.examDate)}</small></div></div>${u.length?continueBox('FORTSETZEN',`${u.length} unsichere Karten warten noch`,'Diese Karten wurden in der letzten Runde als „Noch üben“ markiert.','unsure'):''}${!u.length&&r.length?continueBox('FEHLERKARTEN DER ERSTEN RUNDE',`${r.length} Karten später nochmals festigen`,'Diese Karten waren am Anfang schwierig, auch wenn sie inzwischen richtig waren.','review'):''}<p class="label">ALLE KARTEN ÜBEN</p>${modeCard('☼','Mündlich','Erst überlegen, Lösung aufdecken und selbst bewerten.','oral')}${modeCard('✎','Schriftlich','Antwort eintippen und direkt vergleichen.','written orange')}<p class="label">GESPEICHERTE KARTEN</p><div class="box blue">${l.cards.map((c,i)=>`<div class="meta" style="padding:7px 0;border-bottom:1px solid #dbe4fa">${i+1}. <b>${esc(c.front)}</b> → ${esc(c.back)}</div>`).join('')}</div><p class="label">LEKTION VERWALTEN</p><button class="btn" onclick="create(state.selected)">Karten bearbeiten & ergänzen</button><button class="btn ghost" onclick="resetProgress()">Lernfortschritt zurücksetzen</button><button class="btn danger" onclick="deleteLesson()">Lektion endgültig löschen</button></section>`)}
function continueBox(e,t,p,kind){return `<div class="box ${kind==='unsure'?'yellow':'blue'}"><div class="eyebrow">${e}</div><h3>${t}</h3><p>${p}</p><div class="split"><button class="btn green" onclick="startReview('${kind}','oral')">Mündlich</button><button class="btn coral" onclick="startReview('${kind}','written')">Schriftlich</button></div></div>`}
function modeCard(icon,title,text,mode){let base=mode.split(' ')[0];return `<button class="mode ${mode.includes('orange')?'orange':''}" onclick="chooseMode('${base}')"><span class="mode-icon">${icon}</span><span><h3>${title}</h3><p>${text}</p></span><span class="arrow">›</span></button>`}
function chooseMode(mode){state.mode=mode;let l=state.selected;app(`<section class="screen"><button class="back" onclick="detail('${l.id}')">‹ Lektion</button><p class="eyebrow">${mode==='oral'?'MÜNDLICH':'SCHRIFTLICH'}</p><h1 class="title">In welche Richtung?</h1><div class="direction"><button class="btn" onclick="startAll('${mode}','forward')">${l.left} → ${l.right}</button><button class="btn ghost" onclick="startAll('${mode}','reverse')">${l.right} → ${l.left}</button><button class="btn ghost" onclick="startAll('${mode}','mixed')">Gemischt</button></div></section>`)}
function startAll(mode,dir){start(mode,dir,[...state.selected.cards],1,false)}
function startReview(kind,mode){let p=state.selected.progress||freshProgress(),ids=kind==='unsure'?p.unsure:p.review;start(mode,p.lastDirection||'forward',state.selected.cards.filter(c=>ids.includes(c.id)),2,true)}
function start(mode,dir,cards,round,repeat){if(!cards.length)return toast('Keine passenden Karten vorhanden.');Object.assign(state,{mode,direction:dir,study:cards.sort(()=>Math.random()-.5),index:0,correct:0,unsure:[],round,revealed:false,writtenChecked:false});state.repeat=repeat;study()}
function study(){let c=state.study[state.index],reverse=state.direction==='reverse'||(state.direction==='mixed'&&state.index%2===1),q=reverse?c.back:c.front,a=reverse?c.front:c.back,l=state.selected;app(`<section class="screen"><div class="study-head"><button class="back" onclick="detail('${l.id}')">‹ Lektion</button><span class="badge">${state.repeat?'WIEDERHOLUNG':'RUNDE'} ${state.round}</span><span class="count">${state.index+1}/${state.study.length}</span></div><div class="bar"><i style="width:${(state.index+1)/state.study.length*100}%"></i></div><div class="study-label">${state.mode==='oral'?'MÜNDLICH':'SCHRIFTLICH'} · ${reverse?l.right+' → '+l.left:l.left+' → '+l.right}</div><div class="question"><div class="hint">${state.mode==='oral'?'WIE LAUTET DIE ANTWORT?':'SCHREIBE DIE ANTWORT'}</div><div class="q">${esc(q)}</div>${state.mode==='oral'&&state.revealed?`<div class="answer">${esc(a)}</div>`:''}</div>${state.mode==='oral'?oralControls():writtenControls(a)}</section>`)}
function oralControls(){return !state.revealed?`<button class="btn" onclick="state.revealed=true;study()">Lösung aufdecken</button>`:`<p class="meta" style="text-align:center;margin:18px 0 0">Hast du es gewusst?</p><div class="rate"><button class="btn coral" onclick="rate(false)">↻<br>Noch üben</button><button class="btn green" onclick="rate(true)">✓<br>Gewusst</button></div>`}
function writtenControls(answer){return `<input id="answer" class="input" style="margin-top:16px" placeholder="Deine Antwort …" autocomplete="off" autocapitalize="none"> <button class="btn" onclick="checkWritten('${encodeURIComponent(answer)}')">Antwort prüfen</button>`}
function checkWritten(encoded){let answer=decodeURIComponent(encoded),v=document.querySelector('#answer').value;if(!v.trim())return toast('Bitte gib eine Antwort ein.');let ok=normal(v)===normal(answer);document.querySelector('.question').insertAdjacentHTML('afterend',`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'✓ Korrekt!':'↻ Noch nicht ganz'}</b>${ok?'':`<div class="meta" style="margin-top:8px">Richtige Antwort: <b>${esc(answer)}</b></div>`}<button class="btn ${ok?'green':'coral'}" onclick="rate(${ok})">Weiter</button></div>`);document.querySelector('#answer').disabled=true;document.querySelector('.screen>.btn:last-child')?.remove()}
function rate(ok){let c=state.study[state.index];if(ok)state.correct++;else state.unsure.push(c.id);if(state.index<state.study.length-1){state.index++;state.revealed=false;study();return}finish()}
function finish(){let l=state.selected,p=l.progress||freshProgress(),first=state.round===1;let review=first?state.unsure:[...(p.review||[])];let score=Math.round(state.correct/state.study.length*100);l.progress={...p,unsure:state.unsure,review,lastDirection:state.direction,correct:(p.correct||0)+state.correct,attempted:(p.attempted||0)+state.study.length,rounds:(p.rounds||0)+1,lastScore:score};state.lessons=state.lessons.map(x=>x.id===l.id?l:x);let coins=l.cards.length>=8?state.correct*(first?2:1)+(state.unsure.length===0?5:0):0;state.coins+=coins;save();state.roundCoins=coins;result(score)}
function result(score){app(`<section class="result"><div class="big">✦</div><h1 class="title">Runde geschafft!</h1><p class="intro">${state.correct} von ${state.study.length} Karten gewusst</p><div class="score"><b>${score}%</b><span>TREFFERQUOTE</span></div><p class="intro">${state.unsure.length?`${state.unsure.length} Karten sind für die nächste Wiederholung markiert.`:'Alle Karten sind aktuell sicher markiert.'}</p>${state.roundCoins?`<div class="box yellow">+${state.roundCoins} Coins</div>`:''}${state.unsure.length?`<button class="btn" onclick="start(' ${state.mode}'.trim(),state.direction,state.selected.cards.filter(c=>state.unsure.includes(c.id)),state.round+1,true)">Unsichere Karten wiederholen (${state.unsure.length})</button>`:''}<button class="btn ghost" onclick="detail('${state.selected.id}')">Zur Lektion</button><button class="btn ghost" onclick="home()">Zur Übersicht</button></section>`)}
function resetProgress(){if(!confirm('Lernfortschritt zurücksetzen? Die Karten bleiben erhalten.'))return;state.selected.progress=freshProgress();state.lessons=state.lessons.map(l=>l.id===state.selected.id?state.selected:l);save();toast('Lernfortschritt zurückgesetzt.');detail(state.selected.id)}
function deleteLesson(){if(!confirm(`Lektion „${state.selected.title}“ endgültig löschen?`))return;state.lessons=state.lessons.filter(l=>l.id!==state.selected.id);save();home()}
function backupData(){return JSON.stringify({version:1,exportedAt:new Date().toISOString(),lessons:state.lessons,coins:state.coins,avatar:state.avatar},null,2)}
function settings(){let data=backupData();app(`<section class="screen"><button class="back" onclick="home()">‹ Übersicht</button><p class="eyebrow">DATEN & SICHERHEIT</p><h1 class="title">Deine Lernfunken-Daten</h1><p class="intro">Alle Daten liegen nur auf diesem Gerät. Sichere sie vor dem Gerätewechsel oder bevor du Browserdaten löschst.</p><button class="btn" onclick="downloadBackup()">Sicherung als Datei herunterladen</button><button class="btn ghost" onclick="copyBackup()">Sicherung in Zwischenablage kopieren</button><label class="field">Sicherungsinhalt</label><textarea id="backupText" class="area" readonly>${esc(data)}</textarea><label class="field">Sicherung wiederherstellen</label><input id="restore" class="input" type="file" accept="application/json"><button class="btn ghost" onclick="restoreBackup()">Sicherungsdatei importieren</button><p class="label">SPÄTER: LEKTION TEILEN</p><div class="box blue"><b>QR-Import/Export folgt als nächster Schritt.</b><p>Für grössere Lektionen ergänzen wir zusätzlich die Datei-Übertragung.</p></div></section>`)}
function downloadBackup(){let blob=new Blob([backupData()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lernfunken-sicherung.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300);toast('Sicherung wird heruntergeladen.')}function copyBackup(){let text=backupData();navigator.clipboard?.writeText(text).then(()=>toast('Sicherung wurde kopiert.')).catch(()=>{let t=document.querySelector('#backupText');t.select();document.execCommand('copy');toast('Sicherung wurde kopiert.')})}
function restoreBackup(){let f=document.querySelector('#restore').files[0];if(!f)return toast('Bitte wähle zuerst eine Sicherungsdatei.');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.lessons))throw Error();state.lessons=d.lessons;state.coins=Number(d.coins)||0;state.avatar={id:'spark',color:'blue',owned:['a:spark','c:blue'],...(d.avatar||{})};save();toast('Sicherung wiederhergestellt.');home()}catch(e){toast('Diese Datei ist keine gültige Lernfunken-Sicherung.')}};r.readAsText(f)}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));home();
</script></body></html>
